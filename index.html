
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Online</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>HANABI</h1>
            <p>ONLINE CARD GAME</p>
        </header>

        <p id="status">接続中...</p>

        <section id="title-screen" hidden>
            <label for="player-name">プレイヤー名</label>
            <input id="player-name" maxlength="20"
                   placeholder="名前を入力">

            <h2>ルーム作成</h2>

            <label for="player-count">プレイ人数</label>
            <select id="player-count">
                <option value="2">2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
                <option value="5">5人</option>
            </select>

            <label for="game-mode">ゲームモード</label>
            <select id="game-mode">
                <option value="normal">ノーマルモード</option>
                <option value="memo">メモモード</option>
            </select>

            <button id="create-room">ルーム作成</button>

            <hr>

            <h2>ルーム参加</h2>
            <input id="room-input" maxlength="6"
                   placeholder="ルームID">
            <button id="join-room">ルーム参加</button>
        </section>

        <section id="lobby-screen" hidden>
            <p>ROOM ID</p>
            <h2 id="room-code"></h2>
            <button id="copy-room">IDをコピー</button>

            <p id="room-info"></p>

            <h2>参加者</h2>
            <ul id="player-list"></ul>

            <h2>チャット</h2>
            <div id="chat-log"></div>

            <form id="chat-form">
                <input id="chat-input" maxlength="300"
                       placeholder="メッセージを入力"
                       autocomplete="off">
                <button type="submit">送信</button>
            </form>

            <button id="start-game" disabled>
                ゲーム開始（未実装）
            </button>
            <button id="leave-room" class="secondary">
                退出
            </button>
        </section>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
